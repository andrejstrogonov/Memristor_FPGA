[GENERAL]
run_engine = openfpga_shell
power_tech_file = ${PATH:OPENFPGA_PATH}/openfpga_flow/tech/PTM_45nm/45nm.xml
power_analysis = false
spice_output = false
verilog_output = true
timeout_each_job = 20*60
fpga_flow = yosys_vpr

[OpenFPGA_SHELL]
openfpga_shell_template = ${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_shell_scripts/example_without_ace_script.openfpga
openfpga_arch_file = ${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_arch/k4_N4_40nm_cc_openfpga.xml
openfpga_sim_setting_file = ${PATH:OPENFPGA_PATH}/openfpga_flow/openfpga_simulation_settings/fixed_sim_openfpga.xml

[ARCHITECTURES]
arch0 = ${PATH:OPENFPGA_PATH}/openfpga_flow/vpr_arch/k4_N4_tileable_40nm.xml

[BENCHMARKS]
bench0 = ${PATH:OPENFPGA_PATH}/openfpga_flow/benchmarks/ubm/simple_registers/counters/counterup16_1clk_posedge_sync_resetp/counterup16_1clk_posedge_sync_resetp.v

[SYNTHESIS_PARAM]
bench_yosys_common = ${PATH:OPENFPGA_PATH}/openfpga_flow/misc/ys_tmpl_yosys_vpr_flow.ys
bench_yosys_rewrite_common = ${PATH:OPENFPGA_PATH}/openfpga_flow/misc/ys_tmpl_yosys_vpr_flow_with_rewrite.ys;${PATH:OPENFPGA_PATH}/openfpga_flow/misc/ys_tmpl_rewrite_flow.ys
bench_read_verilog_options_common = -nolatches

bench0_top = counterup16_1clk_posedge_sync_resetp
bench0_openfpga_pin_constraints_file = ${PATH:TASK_DIR}/config/pin_constraints_rst.xml

[SCRIPT_PARAM_DEFAULT]
# end_flow_with_test =
# vpr_fpga_verilog_formal_verification_top_netlist =

[FLOW_PARAMETERS]
vpr_route_chan_width = 74